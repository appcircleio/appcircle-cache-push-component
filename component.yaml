platform: Common
buildPlatform:
displayName: "Cache Push"
description: "Uploads user selected files and folders to Appcircle cache."
inputs:
- key: "AC_CACHE_LABEL"
  defaultValue: "$AC_GIT_BRANCH/cache"
  isRequired: true
  title: Cache Label
  description: "User defined cache label to identify one cache from others. Both cache push and pull steps should have the same value to match."
  helpText:
- key: "AC_CACHE_INCLUDED_PATHS"
  isRequired: true
  title: Included Paths
  description: "Specifies the files and folders which should be in cache. Multiple glob patterns can be provided as a colon-separated list. For example; .gradle:app/build"
  helpText:
- key: "AC_CACHE_EXCLUDED_PATHS"
  isRequired: false
  title: Excluded Paths
  description: "Specifies the files and folders which should be ignored from cache. Multiple glob patterns can be provided as a colon-separated list. For example; .gradle/*.lock:*.apk"
  helpText: "An exclude applies only to includes with the same prefix. A pattern without a prefix (for example *.lock) applies only to repository includes. To exclude inside a ~/ include, start the pattern with ~/ (for example ~/.gradle/**/*.lock)."
- key: "AC_CACHE_KEY_FILE"
  defaultValue: ""
  isRequired: false
  title: Cache Key File
  description: "Path to your dependency lock file, relative to the repository root. Cache push will be skipped if this file hasn't changed since the last successful push, saving compression and upload time. Leave empty to always push."
  helpText: "Podfile.lock (iOS), gradle/libs.versions.toml (Android), yarn.lock or package-lock.json (React Native), pubspec.lock (Flutter)"
- key: "AC_REPOSITORY_DIR"
  defaultValue: "$AC_REPOSITORY_DIR"
  isRequired: false
  title: Repository Path
  description: "Specifies the cloned repository path."
processFilename: ruby
processArguments: '%AC_STEP_TEMP%/main.rb'
files:
- "main.rb"
